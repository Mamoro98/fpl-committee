[project]
name = "fpl-committee"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx", "pydantic>=2", "python-dotenv", "fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
committee = "committee.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
committee = ["prompts/*.md", "static/*.html"]
