<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL Committee</title>
<style>
  :root {
    --bg: #12101a;
    --card: #1c1927;
    --line: #2c2840;
    --text: #ece9f4;
    --muted: #9a93b3;
    --accent: #00ff87;
    --accent-dark: #04c96e;
    --purple: #7b6cff;
    --danger: #ff5470;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
    max-width: 900px; margin-inline: auto;
  }
  h1 { font-size: 1.4rem; margin: 0 0 1.5rem; letter-spacing: 0.02em; }
  h1 span { color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-bottom: 1.5rem; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 1rem; text-align: center;
  }
  .card .name { color: var(--muted); text-transform: capitalize; font-size: 0.85rem; }
  .card .score { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
  .card .picks { color: var(--muted); font-size: 0.75rem; }
  .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  button {
    background: var(--accent); color: #08240f; border: 0; border-radius: 8px;
    padding: 0.55rem 1.1rem; font-weight: 700; font-size: 0.95rem; cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { background: var(--line); color: var(--muted); cursor: wait; }
  button.secondary { background: var(--purple); color: white; }
  input[type=number] {
    width: 5rem; padding: 0.5rem; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 1rem;
  }
  #status { color: var(--muted); font-size: 0.9rem; min-height: 1.4em; margin-bottom: 1rem; }
  #status.error { color: var(--danger); }
  #memo {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 1.2rem; overflow-x: auto;
  }
  #memo:empty { display: none; }
  #memo table { border-collapse: collapse; width: 100%; }
  #memo th, #memo td { border: 1px solid var(--line); padding: 0.4rem 0.6rem; text-align: left; }
  #memo th { color: var(--muted); }
  #memo h1, #memo h2 { font-size: 1.1rem; color: var(--accent); }
  #pickrow button { text-transform: capitalize; }
  .spin {
    display: inline-block; width: 1em; height: 1em; border-radius: 50%;
    border: 2px solid var(--muted); border-top-color: var(--accent);
    animation: r 0.8s linear infinite; vertical-align: -0.15em;
  }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h1>FPL <span>Transfer Committee</span></h1>

<div class="cards" id="cards"></div>

<div class="row">
  <label for="gw">GW</label>
  <input type="number" id="gw" min="1" max="38" value="1">
  <button id="btn-memo">Run debate</button>
  <button id="btn-settle" class="secondary">Settle</button>
  <button id="btn-draft" class="secondary">Draft squad (one-off)</button>
</div>

<div class="row" id="pickrow" hidden>
  <span>Pick:</span>
</div>

<div id="status"></div>
<div id="memo"></div>

<script>
const $ = (id) => document.getElementById(id);
const status = (text, isError = false) => {
  $("status").textContent = text;
  $("status").className = isError ? "error" : "";
};

function renderMarkdown(md) {
  const esc = md.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const lines = esc.split("\n");
  let html = "", inTable = false, listOpen = false;
  for (const line of lines) {
    if (line.startsWith("|")) {
      const cells = line.split("|").slice(1, -1).map(c => c.trim());
      if (cells.every(c => /^-+$/.test(c))) continue;
      const tag = inTable ? "td" : "th";
      if (!inTable) { html += "<table>"; inTable = true; }
      html += "<tr>" + cells.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
      continue;
    }
    if (inTable) { html += "</table>"; inTable = false; }
    if (line.startsWith("- ")) {
      if (!listOpen) { html += "<ul>"; listOpen = true; }
      html += `<li>${inline(line.slice(2))}</li>`;
      continue;
    }
    if (listOpen) { html += "</ul>"; listOpen = false; }
    if (line.startsWith("## ")) html += `<h2>${inline(line.slice(3))}</h2>`;
    else if (line.startsWith("# ")) html += `<h1>${inline(line.slice(2))}</h1>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  if (inTable) html += "</table>";
  if (listOpen) html += "</ul>";
  return html;
}
const inline = (t) =>
  t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");

async function refreshScoreboard() {
  const r = await fetch("/api/scoreboard");
  const data = await r.json();
  const picks = {};
  for (const e of data.history) picks[e.picked] = (picks[e.picked] || 0) + 1;
  $("cards").innerHTML = Object.entries(data.scores)
    .sort((a, b) => b[1] - a[1])
    .map(([name, score]) => `
      <div class="card">
        <div class="name">${name}</div>
        <div class="score">${score.toFixed(2)}</div>
        <div class="picks">picked ${picks[name] || 0}x</div>
      </div>`).join("");
}

async function longPost(url, label) {
  const buttons = document.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  status(label + " ");
  $("status").insertAdjacentHTML("beforeend", '<span class="spin"></span>');
  try {
    const r = await fetch(url, { method: "POST" });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    return data;
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

$("btn-memo").onclick = async () => {
  const gw = $("gw").value;
  try {
    const data = await longPost(`/api/memo/${gw}`, `Debating GW${gw}, takes a minute or two...`);
    $("memo").innerHTML = renderMarkdown(data.memo);
    $("pickrow").hidden = false;
    $("pickrow").querySelectorAll("button").forEach(b => b.remove());
    for (const agent of data.agents) {
      const b = document.createElement("button");
      b.textContent = agent;
      b.onclick = async () => {
        try {
          await longPost(`/api/pick/${gw}/${agent}`, `Recording pick...`);
          status(`GW${gw}: picked ${agent}. Now make the real transfer in the FPL app.`);
          $("pickrow").hidden = true;
          refreshScoreboard();
        } catch (e) { status(e.message, true); }
      };
      $("pickrow").appendChild(b);
    }
    status(`GW${gw} memo ready. Read it, then pick.`);
  } catch (e) { status(e.message, true); }
};

$("btn-draft").onclick = async () => {
  try {
    const data = await longPost("/api/draft", "Drafting three full squads, takes a few minutes...");
    $("memo").innerHTML = renderMarkdown(data.memo);
    $("pickrow").hidden = true;
    status("Draft memo ready. No pick needed, this one is advice only.");
  } catch (e) { status(e.message, true); }
};

$("btn-settle").onclick = async () => {
  const gw = $("gw").value;
  try {
    const data = await longPost(`/api/settle/${gw}`, `Settling GW${gw}...`);
    status(`GW${gw}: ${data.picked} rewarded ${data.reward.toFixed(1)}.`);
    refreshScoreboard();
  } catch (e) { status(e.message, true); }
};

refreshScoreboard();
</script>
</body>
</html>
