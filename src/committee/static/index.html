<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL Committee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #152420;
    --board-deep: #0f1b18;
    --chalk: #f2efe6;
    --chalk-dim: #9fb0a8;
    --line: #2a3f38;
    --armband: #e8c34a;
    --scout: #7fd1c8;
    --risk: #e0965a;
    --hawk: #b39ddb;
    --foul: #e26d6d;
  }
  * { box-sizing: border-box; }
  html { background: var(--board-deep); }
  body {
    margin: 0 auto; padding: 2.5rem 1.25rem 5rem; max-width: 1020px;
    background: var(--board); color: var(--chalk);
    font: 16px/1.55 Barlow, system-ui, sans-serif;
    border-inline: 1px solid var(--line);
    min-height: 100vh;
  }
  h1, h2, .display {
    font-family: "Barlow Condensed", sans-serif;
    text-transform: uppercase; letter-spacing: 0.04em; margin: 0;
  }
  .num { font-family: "IBM Plex Mono", monospace; }

  header { border-bottom: 2px solid var(--chalk); padding-bottom: 1rem; margin-bottom: 1.75rem; }
  header h1 { font-size: 2.4rem; font-weight: 700; line-height: 1; }
  header p { margin: 0.35rem 0 0; color: var(--chalk-dim); }

  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 1.25rem; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    border: 1px solid var(--line); border-radius: 4px;
    background: color-mix(in srgb, var(--board) 60%, var(--board-deep));
    padding: 1.1rem 1.2rem;
  }
  .panel h2 {
    font-size: 1.05rem; font-weight: 600; color: var(--chalk-dim);
    margin-bottom: 0.8rem;
  }

  /* Standings: the signature */
  #standings table { width: 100%; border-collapse: collapse; }
  #standings td {
    padding: 0.55rem 0.3rem; border-top: 1px solid var(--line);
    vertical-align: middle;
  }
  #standings tr { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    #standings tr { animation: chalk 0.4s ease both; }
    #standings tr:nth-child(2) { animation-delay: 0.12s; }
    #standings tr:nth-child(3) { animation-delay: 0.24s; }
    @keyframes chalk { from { opacity: 0; transform: translateX(-6px); } }
  }
  .pos { color: var(--chalk-dim); width: 1.4rem; }
  .dot {
    display: inline-block; width: 0.65rem; height: 0.65rem; border-radius: 50%;
    margin-right: 0.5rem; vertical-align: baseline;
  }
  .agent-name { text-transform: capitalize; font-weight: 600; }
  .score-cell { text-align: right; font-size: 1.15rem; }
  .picked-cell { text-align: right; color: var(--chalk-dim); font-size: 0.8rem; width: 4.5rem; }

  /* Team sheet */
  #squad .posrow { border-top: 1px dashed var(--line); padding: 0.45rem 0; }
  #squad .poslabel {
    font-family: "Barlow Condensed", sans-serif; color: var(--chalk-dim);
    width: 2.8rem; display: inline-block; letter-spacing: 0.08em;
  }
  .chip { white-space: nowrap; margin-right: 0.7rem; }
  .chip .num { color: var(--chalk-dim); font-size: 0.8rem; }
  .flag { color: var(--foul); font-weight: 700; }

  /* Console */
  .console { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: stretch; }
  input[type=number] {
    width: 4.6rem; padding: 0.5rem 0.6rem; border-radius: 4px;
    border: 1px solid var(--line); background: var(--board-deep);
    color: var(--chalk); font: 600 1.05rem "IBM Plex Mono", monospace; text-align: center;
  }
  button {
    font: 600 0.95rem "Barlow Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: 0.06em; cursor: pointer; border-radius: 4px;
    padding: 0.55rem 1.15rem; border: 1px solid var(--chalk);
    background: var(--chalk); color: var(--board);
  }
  button:hover { background: var(--armband); border-color: var(--armband); }
  button.quiet { background: transparent; color: var(--chalk); }
  button.quiet:hover { color: var(--armband); border-color: var(--armband); background: transparent; }
  button:disabled { opacity: 0.45; cursor: wait; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--armband); outline-offset: 2px; }

  #archive .item {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; text-align: left; background: transparent; border: 0;
    border-top: 1px dashed var(--line); border-radius: 0;
    color: var(--chalk); padding: 0.5rem 0.2rem; font: 500 0.95rem Barlow, sans-serif;
    text-transform: none; letter-spacing: 0;
  }
  #archive .item:hover { background: var(--line); }
  #archive .item.active { color: var(--armband); }
  #archive .meta { color: var(--chalk-dim); font-size: 0.8rem; }

  #pickrow { margin-top: 0.8rem; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  #pickrow[hidden] { display: none; }
  #pickrow button { border-width: 2px; background: transparent; color: var(--chalk); }
  #pickrow button.scout { border-color: var(--scout); }
  #pickrow button.risk { border-color: var(--risk); }
  #pickrow button.hawk { border-color: var(--hawk); }
  #pickrow button:hover { background: var(--line); }

  #status { margin: 0.9rem 0 0; color: var(--chalk-dim); min-height: 1.5em; }
  #status.error { color: var(--foul); }
  #status.error::before { content: "✕ "; }

  /* Debate thread */
  #thread { margin-top: 1.25rem; }
  #thread:empty { display: none; }
  #thread .roundhead {
    font-family: "Barlow Condensed", sans-serif; text-transform: uppercase;
    color: var(--chalk-dim); letter-spacing: 0.08em; margin: 1rem 0 0.5rem;
    border-bottom: 1px dashed var(--line); padding-bottom: 0.25rem;
  }
  .turn {
    border-left: 3px solid var(--line); padding: 0.5rem 0.8rem; margin: 0.5rem 0;
    background: color-mix(in srgb, var(--board) 70%, var(--board-deep));
  }
  .turn .who {
    font-family: "Barlow Condensed", sans-serif; text-transform: capitalize;
    font-weight: 600; letter-spacing: 0.04em;
  }
  .turn .attack { color: var(--foul); margin: 0.3rem 0 0; }
  .turn .attack::before { content: "⚔ "; }

  /* Minutes (memo) */
  #memo { margin-top: 1.25rem; }
  #memo:empty { display: none; }
  #memo h1 { font-size: 1.4rem; border-bottom: 1px solid var(--line); padding-bottom: 0.4rem; }
  #memo h2 { font-size: 1.05rem; color: var(--armband); margin-top: 1.2rem; }
  #memo table { border-collapse: collapse; width: 100%; margin: 0.6rem 0; }
  #memo th, #memo td { border: 1px solid var(--line); padding: 0.45rem 0.6rem; text-align: left; }
  #memo th { font-family: "Barlow Condensed", sans-serif; text-transform: uppercase; color: var(--chalk-dim); }
  #memo li { margin: 0.25rem 0; }
  #memo strong { color: var(--armband); font-weight: 600; }

  .spin {
    display: inline-block; width: 0.9em; height: 0.9em; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--armband);
    animation: r 0.8s linear infinite; vertical-align: -0.1em;
  }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>Transfer Committee</h1>
  <p>Three advisors. One pick. Real points settle the argument.</p>
</header>

<div class="grid">
  <div>
    <section class="panel" id="standings-panel">
      <h2>Standings</h2>
      <div id="standings"></div>
    </section>
    <section class="panel" id="squad-panel" style="margin-top: 1.25rem;">
      <h2>Team sheet</h2>
      <div id="squad"></div>
    </section>
    <section class="panel" style="margin-top: 1.25rem;">
      <h2>Archive</h2>
      <div id="archive"><span style="color:var(--chalk-dim)">No debates yet. Run one.</span></div>
    </section>
  </div>

  <div>
    <section class="panel">
      <h2>This gameweek</h2>
      <div class="console">
        <label class="display" for="gw" style="align-self: center; color: var(--chalk-dim);">GW</label>
        <input type="number" id="gw" min="1" max="38" value="1">
        <button id="btn-memo">Run debate</button>
        <button id="btn-settle" class="quiet">Settle gameweek</button>
        <button id="btn-draft" class="quiet">Draft full squad</button>
      </div>
      <div id="pickrow" hidden><span class="display" style="color: var(--chalk-dim);">Your pick:</span></div>
      <p id="status"></p>
      <section id="thread"></section>
      <article id="memo"></article>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const AGENT_COLORS = { scout: "var(--scout)", risk: "var(--risk)", hawk: "var(--hawk)" };
const status = (text, isError = false) => {
  $("status").textContent = text;
  $("status").className = isError ? "error" : "";
};

const inline = (t) =>
  t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");

function renderMarkdown(md) {
  const esc = md.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const lines = esc.split("\n");
  let html = "", inTable = false, listOpen = false;
  for (const line of lines) {
    if (line.startsWith("|")) {
      const cells = line.split("|").slice(1, -1).map(c => c.trim());
      if (cells.every(c => /^-+$/.test(c))) continue;
      const tag = inTable ? "td" : "th";
      if (!inTable) { html += "<table>"; inTable = true; }
      html += "<tr>" + cells.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
      continue;
    }
    if (inTable) { html += "</table>"; inTable = false; }
    if (line.startsWith("- ")) {
      if (!listOpen) { html += "<ul>"; listOpen = true; }
      html += `<li>${inline(line.slice(2))}</li>`;
      continue;
    }
    if (listOpen) { html += "</ul>"; listOpen = false; }
    if (line.startsWith("## ")) html += `<h2>${inline(line.slice(3))}</h2>`;
    else if (line.startsWith("# ")) html += `<h1>${inline(line.slice(2))}</h1>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  if (inTable) html += "</table>";
  if (listOpen) html += "</ul>";
  return html;
}

function renderThread(thread) {
  if (!thread || !thread.length) { $("thread").innerHTML = ""; return; }
  let html = "", lastRound = 0;
  for (const turn of thread) {
    if (turn.round !== lastRound) {
      lastRound = turn.round;
      html += `<div class="roundhead">Round ${turn.round}${turn.round === 2 ? ": attacks and final positions" : ": opening positions"}</div>`;
    }
    const attacks = (turn.attacks || []).map(a => `<p class="attack">${a}</p>`).join("");
    html += `
      <div class="turn" style="border-left-color:${AGENT_COLORS[turn.agent] || "var(--line)"}">
        <span class="who">${turn.agent}</span>
        <p style="margin:0.25rem 0 0;">${turn.text}</p>
        ${attacks}
      </div>`;
  }
  $("thread").innerHTML = html;
}

async function refreshStandings() {
  const r = await fetch("/api/scoreboard");
  const data = await r.json();
  const picks = {};
  for (const e of data.history) picks[e.picked] = (picks[e.picked] || 0) + 1;
  const rows = Object.entries(data.scores)
    .sort((a, b) => b[1] - a[1])
    .map(([name, score], i) => `
      <tr>
        <td class="pos num">${i + 1}</td>
        <td><span class="dot" style="background:${AGENT_COLORS[name]}"></span>
            <span class="agent-name">${name}</span></td>
        <td class="score-cell num">${score.toFixed(2)}</td>
        <td class="picked-cell num">${picks[name] || 0}×</td>
      </tr>`).join("");
  $("standings").innerHTML = `<table><tbody>${rows}</tbody></table>`;
}

async function refreshSquad() {
  const r = await fetch("/api/squad");
  const data = await r.json();
  if (!data.squad) {
    $("squad").innerHTML = `
      <p style="color:var(--chalk-dim); margin-top:0;">${data.reason}.</p>
      <textarea id="squad-names" rows="8" placeholder="One player name per line, 15 names.&#10;Haaland&#10;Saka&#10;..." style="width:100%;background:var(--board-deep);color:var(--chalk);border:1px solid var(--line);border-radius:4px;padding:0.6rem;font:0.9rem Barlow,sans-serif;"></textarea>
      <div style="display:flex;gap:0.6rem;margin-top:0.6rem;align-items:center;">
        <label class="display" style="color:var(--chalk-dim);" for="squad-bank">Bank</label>
        <input type="number" id="squad-bank" step="0.1" min="0" value="0.0" style="width:5.2rem;">
        <button id="squad-save">Save team</button>
      </div>
      <p id="squad-msg" style="color:var(--chalk-dim);"></p>`;
    $("squad-save").onclick = saveManualSquad;
    return;
  }
  const order = ["GKP", "DEF", "MID", "FWD"];
  const rows = order.map(pos => {
    const chips = data.squad.filter(p => p.position === pos).map(p =>
      `<span class="chip">${p.name} <span class="num">${p.price}</span>${p.status !== "a" ? ' <span class="flag" title="injury or doubt">!</span>' : ""}</span>`
    ).join("");
    return `<div class="posrow"><span class="poslabel">${pos}</span>${chips}</div>`;
  }).join("");
  const sourceNote = data.source === "manual"
    ? "entered by hand, replaced by FPL data after GW1"
    : `as of GW${data.gw}`;
  $("squad").innerHTML =
    rows + `<div class="posrow"><span class="poslabel">BANK</span><span class="num">${data.bank}m</span> <span style="color:var(--chalk-dim)">(${sourceNote})</span></div>`;
}

async function saveManualSquad() {
  const names = $("squad-names").value.split("\n").map(s => s.trim()).filter(Boolean);
  const bank = parseFloat($("squad-bank").value || "0");
  const r = await fetch("/api/squad/manual", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ names, bank }),
  });
  const data = await r.json();
  if (data.ok) { refreshSquad(); return; }
  if (data.detail) { $("squad-msg").textContent = data.detail; return; }
  $("squad-msg").innerHTML = "Could not match: " + data.unmatched.map(u =>
    `<strong>${u.name}</strong>${u.candidates.length ? " (did you mean: " + u.candidates.join(" / ") + ")" : ""}`
  ).join(", ");
}

async function longPost(url, label) {
  const buttons = document.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  status(label + " ");
  $("status").insertAdjacentHTML("beforeend", '<span class="spin"></span>');
  try {
    const r = await fetch(url, { method: "POST" });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    return data;
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

const sleep = (ms) => new Promise(res => setTimeout(res, ms));

async function runJob(url, label) {
  const buttons = document.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  try {
    const start = await fetch(url, { method: "POST" });
    const { job_id } = await start.json();
    while (true) {
      const s = await (await fetch(`/api/job/${job_id}`)).json();
      if (s.state === "done") return s.result;
      if (s.state === "error") throw new Error(s.error);
      const mins = Math.floor(s.elapsed / 60), secs = s.elapsed % 60;
      status(`${label} Running ${mins}:${String(secs).padStart(2, "0")} `);
      $("status").insertAdjacentHTML("beforeend", '<span class="spin"></span>');
      await sleep(3000);
    }
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

function showPickRow(gw, agents) {
  $("pickrow").hidden = false;
  $("pickrow").querySelectorAll("button").forEach(b => b.remove());
  for (const agent of agents) {
    const b = document.createElement("button");
    b.textContent = agent;
    b.className = agent;
    b.onclick = async () => {
      try {
        await longPost(`/api/pick/${gw}/${agent}`, "Recording your pick.");
        status(`GW${gw}: ${agent} it is. Now make the real transfer in the FPL app.`);
        $("pickrow").hidden = true;
        refreshStandings();
        refreshArchive(`gw${gw}`);
      } catch (e) { status(e.message, true); }
    };
    $("pickrow").appendChild(b);
  }
}

async function refreshArchive(activeName) {
  const r = await fetch("/api/debates");
  const data = await r.json();
  if (!data.debates.length) return;
  $("archive").innerHTML = data.debates.map(d => {
    const meta = d.picked
      ? `${d.picked}${d.reward !== null ? " +" + d.reward : ""}`
      : (d.name === "draft" ? "advice" : "no pick");
    return `<button class="item${d.name === activeName ? " active" : ""}" data-name="${d.name}">
      <span>${d.label}</span><span class="meta">${meta}</span></button>`;
  }).join("");
  $("archive").querySelectorAll(".item").forEach(b => {
    b.onclick = () => openDebate(b.dataset.name);
  });
}

async function openDebate(name) {
  const r = await fetch(`/api/debates/${name}`);
  const data = await r.json();
  if (!r.ok) { status(data.detail || "could not load debate", true); return; }
  renderThread(data.thread);
  $("memo").innerHTML = renderMarkdown(data.memo);
  if (data.can_pick) showPickRow(data.gw, data.agents);
  else $("pickrow").hidden = true;
  refreshArchive(name);
  status(name === "draft" ? "Squad draft, advice only." : `Viewing ${name.toUpperCase()} debate.`);
}

$("btn-memo").onclick = async () => {
  const gw = $("gw").value;
  try {
    const data = await runJob(`/api/memo/${gw}`, `Committee is debating GW${gw}.`);
    renderThread(data.thread);
    $("memo").innerHTML = renderMarkdown(data.memo);
    showPickRow(gw, data.agents);
    refreshArchive(`gw${gw}`);
    status(`GW${gw} minutes are in. Read, then pick.`);
  } catch (e) { status(e.message, true); }
};

$("btn-draft").onclick = async () => {
  try {
    const data = await runJob("/api/draft", "Drafting three full squads.");
    renderThread(data.thread);
    $("memo").innerHTML = renderMarkdown(data.memo);
    $("pickrow").hidden = true;
    refreshArchive("draft");
    status("Draft minutes are in. Advice only, nothing is scored.");
  } catch (e) { status(e.message, true); }
};

$("btn-settle").onclick = async () => {
  const gw = $("gw").value;
  try {
    const data = await longPost(`/api/settle/${gw}`, `Fetching GW${gw} points.`);
    status(`GW${gw} settled: ${data.picked} earns ${data.reward.toFixed(1)}.`);
    refreshStandings();
  } catch (e) { status(e.message, true); }
};

async function openLatest() {
  const r = await fetch("/api/debates");
  const data = await r.json();
  if (data.debates.length) openDebate(data.debates[data.debates.length - 1].name);
}

refreshStandings();
refreshSquad();
openLatest();
</script>
</body>
</html>
